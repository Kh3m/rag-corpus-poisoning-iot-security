[project]
name = "rag-corpus-poisoning-iot-security"
version = "0.1.0"
description = "Corpus poisoning attacks against RAG-based IoT/cyber threat-intelligence assistants, with a lightweight provenance defense"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
    "ollama>=0.6.3",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]
[tool.ruff]
line-length = 120
